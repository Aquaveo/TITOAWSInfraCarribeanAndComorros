name: Deploy shared

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: tofu-shared
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: shared
    env:
      TF_VAR_alert_emails: ${{ secrets.ALERT_EMAILS || '[]' }}
    defaults:
      run:
        working-directory: tofu/shared
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: |
          tofu init -input=false \
            -backend-config="bucket=${{ vars.STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="key=tito/shared.tfstate"
      - run: tofu apply -input=false -auto-approve -var-file=shared.tfvars
